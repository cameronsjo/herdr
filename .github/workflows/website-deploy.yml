name: Trigger Website Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ".github/workflows/website-deploy.yml"
      - "docs/preview/**"
      - "docs/versions/**"
      - "src/detect/manifests/**"
      - "distribution/**"

permissions:
  contents: read

concurrency:
  group: private-website-deploy
  cancel-in-progress: true

jobs:
  trigger:
    # This fork does not publish herdr.dev and does not maintain the published
    # docs contract: docs/versions/manifest.json names upstream tags like `v0.8.2`,
    # while this fork tags `v0.8.2-palette.N`, so the check resolves a ref that
    # cannot exist here. Same guard the fork already applies to pr-gate and
    # preview; it arrived without one because upstream replaced website.yml,
    # which carried it, with these two files.
    if: github.repository == 'herdrdev/herdr'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Cloudflare Pages build
        env:
          DEPLOY_HOOK: ${{ secrets.HERDR_WEBSITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::HERDR_WEBSITE_DEPLOY_HOOK is not configured"
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null
          echo "Triggered private website deploy"
