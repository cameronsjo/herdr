name: Release

# Fork-local release pipeline. Upstream's version of this workflow gated the
# release on a product announcement in the changelog, docs/next/README.md, and a
# website build — none of which this fork maintains — so every tag pushed here
# failed before it built anything.
#
# Tags are v<upstream-version>-palette.<n>: upstream's major/minor/patch as-is,
# with the fork's palette build counter as a semver prerelease.
#
# Apple Silicon only, matching build-artifacts-manual.yml. The binary is
# prebuilt here rather than by the Homebrew formula because libghostty-vt pins
# Zig 0.15.2, whose bundled libSystem predates the macOS 26 SDK, so a native
# build fails to link (herdrdev/herdr#285).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_TOOLCHAIN_VERSION: 1.96.1
  TARGET: aarch64-apple-darwin
  ARTIFACT: herdr-macos-aarch64
  # The optimize/simd pair the tap's builds have shipped since 0.8.0-palette1.
  LIBGHOSTTY_VT_OPTIMIZE: ReleaseSafe
  LIBGHOSTTY_VT_SIMD: "false"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: ${{ env.TARGET }}

      - name: Restore Homebrew Zig cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.15-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.15-${{ runner.os }}-

      - name: Install patched Zig
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          "$(brew --prefix zig@0.15)/bin/zig" version

      - name: Install macOS build tools
        run: brew install cmake ninja

      - name: Remove Zig caches
        run: rm -rf .zig-cache vendor/libghostty-vt/.zig-cache vendor/libghostty-vt/zig-out

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Package artifact
        run: |
          cp "target/$TARGET/release/herdr" "$ARTIFACT"
          file "$ARTIFACT" > BUILD_INFO.txt
          {
            echo "commit=$GITHUB_SHA"
            echo "target=$TARGET"
            echo "libghostty_vt_optimize=$LIBGHOSTTY_VT_OPTIMIZE"
            echo "libghostty_vt_simd=$LIBGHOSTTY_VT_SIMD"
          } >> BUILD_INFO.txt
          python3 -c "import hashlib, os, pathlib; a = pathlib.Path(os.environ['ARTIFACT']); print(f'sha256={hashlib.sha256(a.read_bytes()).hexdigest()}  {a.name}')" >> BUILD_INFO.txt
          cat BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}
            BUILD_INFO.txt
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.ARTIFACT }}

      # The tap trusts the sha256 in the notes, so confirm it describes the file
      # actually being uploaded rather than restating what the build job claimed.
      - name: Verify the artifact matches its recorded digest
        run: |
          grep '^sha256=' BUILD_INFO.txt | sed 's/^sha256=//' > artifact.sha256
          shasum -a 256 -c artifact.sha256

      - name: Compose release notes
        run: python3 scripts/fork_release_notes.py --build-info BUILD_INFO.txt --tag "$GITHUB_REF_NAME" --artifact "$ARTIFACT" --output RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: ${{ env.ARTIFACT }}
          body_path: RELEASE_NOTES.md

  # A separate job on purpose. The tap-write token is the highest-value
  # credential here — it reaches the tap that installs software on real
  # machines — and this job checks out nothing, so that token never shares a
  # runner with the fork tree, which carries upstream code merged weekly.
  # It runs after `release` so a failed publish never points the formula at a
  # release nobody can download.
  tap-bump:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read is what download-artifact needs; nothing here writes to this
    # repo, so contents stays unset. The tap write travels on the App token.
    permissions:
      actions: read

    steps:
      - name: Download build info
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ env.ARTIFACT }}

      - name: Read the artifact digest
        id: digest
        run: |
          sha=$(grep '^sha256=' BUILD_INFO.txt | sed 's/^sha256=//' | awk '{print $1}')
          # Guard here rather than letting an empty value travel: the tap would
          # reject it, but the failure would surface in the tap's run instead of
          # this one, where it is actually diagnosable.
          if [[ ! "$sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::BUILD_INFO.txt carries no usable sha256"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Mint a tap-scoped token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # client-id, not the deprecated app-id: the numeric App ID in
          # RELEASE_APP_ID stays valid under this parameter, and the rename
          # needs v3.1.0+. Same wiring as cameronsjo/cadence-hooks.
          client-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: homebrew-tap
          # Scope the token to what a dispatch needs, not to everything the App
          # installation happens to hold on the tap.
          permission-contents: write

      - name: Bump the Homebrew formula
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          TAG: ${{ github.ref_name }}
          SHA: ${{ steps.digest.outputs.sha }}
        run: |
          # Only the arm64 macOS sha: the tap's receiver requires the supplied
          # platforms to match the ones the formula actually builds for, and
          # this formula carries a single binary.
          gh api repos/cameronsjo/homebrew-tap/dispatches \
            -f event_type=update-formula \
            -f "client_payload[formula]=herdr" \
            -f "client_payload[version]=${TAG#v}" \
            -f "client_payload[sha_macos_aarch64]=${SHA}"
